# This workflow will install Python dependencies, run tests and build release artifacts
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions
name: Build and release

on:
  schedule:
    - cron: "0 13 * * 3"  # weekly on Wednesday at 6:00am PT
  workflow_dispatch:

jobs:
  build_and_release:
    runs-on: ubuntu-latest
    container: obolibrary/odkfull:v1.5.3
    steps:
    - uses: actions/checkout@v4
    - name: Install
      run: |
        make install
    - name: Get current time
      uses: josStorer/get-current-time@v2.0.2
      id: current-time
      with:
        format: YYYY-MM-DD
    - name: build
      run: |
        make all

    - name: Release
      run: echo Uploading files as new release.
    - uses: "marvinpinto/action-automatic-releases@latest"
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        automatic_release_tag: "${{ steps.current-time.outputs.formattedTime }}"
        title: "${{ steps.current-time.outputs.formattedTime }}"
        prerelease: false
        files: |
          mappings/oncotree.owl
          mappings/oncotree.ttl
          mappings/oncotree.sssom.tsv
