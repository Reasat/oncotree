mapping_set_description: >
  The file `mappings/oncotree.sssom.tsv` is generated using the Python package `sssom`, by running the command `make mappings/oncotree.sssom.tsv` from a
  cloned copy of the OncoTree ingest repository. For more information on data sources,
  assumptions, and computations, refer to `README.md` or the comments at the top of `oncotree2obo/main.py` in the OncoTree
  ingest.
